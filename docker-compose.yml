services:
  web:
    image: ${IMAGE:-taskmanager}
    ports:
      - "${PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_USER: taskuser
      DB_PASS: taskpass
      DB_NAME: taskmanager
    depends_on:
      - db

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: taskmanager
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
